<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task1</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4">
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      role="presentation"
    >
      <tr>
        <td align="center" style="padding: 20px 0">
          <!--600px container-->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            role="presentation"
            style="background-color: pink"
          >
            <!--HEADER-->
            <tr>
              <td
                align="center"
                style="
                  background-color: #6366f1;
                  padding: 20px 30px;
                  color: #ffffff;
                "
              >
                <h1
                  style="
                    font-weight: bold;
                    font-size: 24px;
                    margin: 0;
                    color: #ffffff;
                  "
                >
                  Payment Reminder
                </h1>
              </td>
            </tr>

            <!--MESSAGE-->
            <tr>
              <td
                style="
                  padding: 30px;
                  font-size: 16px;
                  line-height: 24px;
                  color: #333333;
                "
              >
                <h2
                  style="
                    margin: 0 0 16px 0;
                    font-size: 18px;
                    font-weight: normal;
                    font-weight: normal;
                  "
                >
                  Hi John Doe,
                </h2>
                <p style="margin: 0">
                  Your invoice
                  <span style="color: #555555; font-weight: bold"
                    >#INV-2048 for $1,250.00</span
                  >
                  is overdue by
                  <span style="color: #ef4444; font-weight: bold">5</span> days.
                </p>
              </td>
            </tr>

            <!--BUTTON-FIXED-->
            <tr>
              <td align="center" style="padding: 0 30px 30px 30px">
                <table
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  role="presentation"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#10b981"
                      style="border-radius: 6px"
                    >
                      <a
                        href="{{link}}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          font-size: 16px;
                          text-decoration: none;
                          color: #ffffff;
                        "
                        >Pay Now</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!--FOOTER-->
            <tr>
              <td
                align="center"
                style="padding: 20px 30px; background-color: #f9f9f9"
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 18px;
                    color: black;
                  "
                >
                  Questions? Reply to this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
