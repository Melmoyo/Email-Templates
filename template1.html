<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template1</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family:
        Arial,
        sans -serif;
    "
  >
    <!--FULL WIDTH WRAPPER-->
    <table
      role="presentation"
      border="0"
      cellpadding="0 cellspacing=0"
      width="100%"
    >
      <tr>
        <td align="center" style="padding: 20px 0">
          <!--600px container-->
          <table
            role="presentation"
            border="0"
            callpading="0"
            cellspacing="0"
            width="600"
            style="background-color: #ffffff; border: 1px solid #dddddd"
          >
            <!--HEADER ROW-->
            <tr>
              <td
                align="center"
                style="padding: 30px 30px 20px 30px; background-color: #6366f1"
              >
                <h1
                  style="
                    margin: 0;
                    font-size: 20px;
                    color: #ffffff;
                    font-weight: bold;
                  "
                >
                  YOUR COMPANY
                </h1>
              </td>
            </tr>

            <!--CONTENT ROW-->
            <tr>
              <td style="padding: 30px 30px 20px 30px">
                <h2 style="margin: 0 0 20px 0; font-size: 20px; color: #333333">
                  Invoice #{{invoice.id}}
                </h2>
                <p
                  style="
                    margin: 0 0 16px 0;
                    font-size: 16px;
                    line-height: 24px;
                    color: #555555;
                  "
                >
                  Hi {{client_name}}
                </p>
                <p
                  style="
                    margin: 0 0 16px 0;
                    font-size: 24px;
                    line-height: 24px;
                    color: #555555;
                  "
                >
                  Thanks for your business.Please find your invoice details
                  below.
                </p>

                <!--content row-->
                <table
                  borde="0"
                  cellspacing="0"
                  cellpadding="0"
                  role="presentation"
                  width="100%"
                  style="border: 1px solid #dddddd"
                >
                  <tr>
                    <td
                      style="
                        padding: 12px;
                        background-color: #f9f9f9;
                        font-size: 14px;
                        font-weight: bold;
                        border-bottom: 1px solid #dddddd;
                      "
                    >
                      Description
                    </td>
                    <td
                      style="
                        padding: 12px;
                        background-color: #f9f9f9;
                        font-size: 14px;
                        font-weight: bold;
                        border-bottom: 1px solid #dddddd;
                      "
                      align="right"
                    >
                      Amount
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px;
                        background-color: #f9f9f9;
                        font-size: 14px;
                        border-bottom: 1px solid #dddddd;
                      "
                    >
                      {{invoice_desc}}
                    </td>
                    <td
                      style="
                        padding: 12px;
                        background-color: #f9f9f9;
                        font-size: 14px;
                        border-bottom: 1px solid #dddddd;
                      "
                      align="right"
                    >
                      {{invoice_amount}}
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 12px;

                        font-size: 16px;
                        font-weight: bold;
                      "
                    >
                      Total Due
                    </td>
                    <td
                      style="
                        padding: 12px;

                        font-size: 16px;
                        font-weight: bold;
                      "
                      align="right"
                    >
                      ${{invoice_amount}}
                    </td>
                  </tr>
                </table>
                <!-- </table> -->
              </td>
            </tr>
            <!--BUTTON ROW-->
            <tr>
              <td align="center" style="padding: 0 30px 30px 30px">
                <!--Bulletproof Button-->
                <table role="presentation">
                  <tr>
                    <td
                      align="center"
                      style="border-radius: 6px; background-color: #10b981"
                    >
                      <a
                        href="{{payment_link}}"
                        target="_blank"
                        style="
                          display: inline-;
                          padding: 14px 28px;
                          font-size: 16px;
                          color: #ffffff;
                          text-decoration: none;
                          font-weight: bold;
                        "
                        >Pay Invoice Now</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!--Footer Now-->
            <tr>
              <td
                style="
                  padding: 20px 30px;
                  background-color: #f9f9f9;
                  border-top: 1px solid #dddddd;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 18px;
                    color: #999999;
                    text-align: center;
                  "
                >
                  Your Company Inc, 123 Business St, Harare, ZW<br />
                  <a
                    href="{{unsubscribe_link}}"
                    style="color: #999999; text-decoration: underline"
                    >Unsubscribe</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
